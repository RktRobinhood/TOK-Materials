<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Catch adventure test</title></head>
<body><p>Loading the adventure with a separate test save… This bench needs the local web server.</p>
<script>
// Reuse the current production document and load order, replacing only its boot.
fetch('../index.html').then(r => r.text()).then(html => {
    html = html.replace('<head>', '<head><base href="../">')
        .replace('<script src="js/main.js"><' + '/script>', '<script src="dev/catch-adventure.js"><' + '/script>');
    document.open(); document.write(html); document.close();
});
</script></body></html>
